name: xmlrpc-flood
description: "Detect WordPress xmlrpc.php POST flood (10+ POSTs in 30s)"
type: leaky_bucket
filter: "evt.service == 'http' && evt.action == 'request' && evt.path == '/xmlrpc.php' && evt.method == 'POST'"
group_by: evt.source_ip
capacity: 10
leak_interval: 30s
blackhole: 1m
labels:
  category: ddos
  service: http
decision:
  type: ban
  duration: 6h
